[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betaestimation"
version = "0.1.0"
description = "Shared fMRI beta / pattern estimation for the lab's MVPA and RSA workflows: fMRIPrep nuisance models, run time series, first-level, LSA, LSS and multi-run GLMs, masks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amy Hegarty", email = "amy.hegarty@colorado.edu" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "nibabel>=5.2",
    "nilearn>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["betaestimation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
